<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobutu Finds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elevated: #141414;
    --bg-hover: #1c1c1c;
    --border: rgba(255, 255, 255, 0.08);
    --text: #f5f5f5;
    --text-muted: #888;
    --text-subtle: #555;
    --accent: #fff;
    --accent-text: #0a0a0a;
    --accent-hover: #e5e5e5;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --radius: 12px;
    --radius-pill: 999px;
  }

  [data-theme="light"] {
    --bg: #fafafa;
    --bg-elevated: #fff;
    --bg-hover: #f0f0f0;
    --border: rgba(0, 0, 0, 0.08);
    --text: #111;
    --text-muted: #666;
    --text-subtle: #999;
    --accent: #111;
    --accent-text: #fff;
    --accent-hover: #333;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    transition: background-color 0.25s ease, color 0.25s ease;
    min-height: 100vh;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 48px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  nav .logo {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    text-transform: lowercase;
  }

  nav .logo span {
    font-weight: 400;
    color: var(--text-muted);
  }

  .profile-menu {
    position: relative;
  }

  .profile-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .profile-btn:hover,
  .profile-btn[aria-expanded="true"] {
    border-color: var(--text-muted);
    background: var(--bg-hover);
    color: var(--text);
  }

  .profile-btn svg {
    width: 20px;
    height: 20px;
  }

  .dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 220px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 8px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }

  .dropdown.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .dropdown-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-subtle);
    padding: 8px 12px 4px;
  }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    background: none;
    color: var(--text);
    font-size: 0.875rem;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s ease;
  }

  .dropdown-item:hover {
    background: var(--bg-hover);
  }

  .dropdown-item.active {
    font-weight: 600;
  }

  .dropdown-item svg {
    width: 16px;
    height: 16px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .dropdown-divider {
    height: 1px;
    background: var(--border);
    margin: 6px 0;
  }

  .hero {
    padding: 32px 48px 8px;
  }

  .search-bar {
    max-width: 480px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s ease;
  }

  .search-bar:focus-within {
    border-color: var(--text-muted);
  }

  .search-bar svg {
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 0.9rem;
    padding: 14px 0;
    font-family: inherit;
  }

  .search-bar input::placeholder {
    color: var(--text-subtle);
  }

  .categories {
    display: flex;
    gap: 8px;
    padding: 28px 48px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .categories::-webkit-scrollbar {
    display: none;
  }

  .category {
    padding: 8px 18px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }

  .category:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }

  .category.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .section-title {
    padding: 8px 48px 0;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-subtle);
  }

  .grid {
    padding: 20px 48px 64px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .card:hover {
    border-color: var(--text-muted);
    transform: translateY(-2px);
  }

  .card img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    display: block;
    background: var(--bg-hover);
  }

  .card-info {
    padding: 16px;
  }

  .card-info h2 {
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }

  .card-info .price {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 14px;
  }

  .buy-btn {
    display: block;
    text-align: center;
    background: var(--accent);
    color: var(--accent-text);
    text-decoration: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    transition: background 0.2s ease;
  }

  .buy-btn:hover {
    background: var(--accent-hover);
  }

  .empty-msg {
    padding: 40px 48px;
    color: var(--text-muted);
    font-size: 0.9rem;
    display: none;
  }

  footer {
    text-align: center;
    padding: 32px 20px;
    color: var(--text-subtle);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 640px) {
    nav, .hero, .categories, .section-title, .grid, .empty-msg {
      padding-left: 20px;
      padding-right: 20px;
    }
  }
</style>
</head>
<body>

  <nav>
    <div class="logo">mobutu<span>finds</span></div>

    <div class="profile-menu">
      <button class="profile-btn" id="profileBtn" aria-expanded="false" aria-haspopup="true" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </button>

      <div class="dropdown" id="profileDropdown" role="menu">
        <div class="dropdown-label" data-i18n="theme">Thème</div>
        <button class="dropdown-item active" data-theme-choice="dark" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <span data-i18n="darkMode">Mode sombre</span>
        </button>
        <button class="dropdown-item" data-theme-choice="light" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span data-i18n="lightMode">Mode clair</span>
        </button>

        <div class="dropdown-divider"></div>

        <div class="dropdown-label" data-i18n="language">Langue</div>
        <button class="dropdown-item active" data-lang-choice="fr" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>Français</span>
        </button>
        <button class="dropdown-item" data-lang-choice="en" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>English</span>
        </button>
      </div>
    </div>
  </nav>

  <section class="hero">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Rechercher un vêtement...">
    </div>
  </section>

  <div class="categories" id="categoryBar">
    <button class="category active" data-category="all" data-i18n="catAll">Tout</button>
    <button class="category" data-category="tshirt" data-i18n="catTshirt">T-shirts</button>
    <button class="category" data-category="veste" data-i18n="catVeste">Vestes</button>
    <button class="category" data-category="pantalon" data-i18n="catPantalon">Pantalons</button>
    <button class="category" data-category="chaussure" data-i18n="catChaussure">Chaussures</button>
    <button class="category" data-category="accessoire" data-i18n="catAccessoire">Accessoires</button>
    <button class="category" data-category="sac" data-i18n="catSac">Sacs</button>
    <button class="category" data-category="montre" data-i18n="catMontre">Montres</button>
  </div>

  <h2 class="section-title" data-i18n="popular">Populaire</h2>
  <main class="grid" id="productGrid">

    <div class="card" data-category="tshirt" data-name-fr="t-shirt blanc fleuri" data-name-en="white floral t-shirt">
      <img src="https://via.placeholder.com/400x500/1e1e1e/666?text=Photo" data-i18n-alt="productAlt" alt="Nom du vêtement">
      <div class="card-info">
        <h2 data-i18n="productName">Nom du vêtement</h2>
        <p class="price">29,99 €</p>
        <a href="https://www.exemple-boutique.com" class="buy-btn" target="_blank" data-i18n="buy">Acheter</a>
      </div>
    </div>

    <div class="card" data-category="veste" data-name-fr="veste noire" data-name-en="black jacket">
      <img src="https://via.placeholder.com/400x500/1e1e1e/666?text=Photo" data-i18n-alt="productAlt" alt="Nom du vêtement">
      <div class="card-info">
        <h2 data-i18n="productName">Nom du vêtement</h2>
        <p class="price">49,99 €</p>
        <a href="https://www.exemple-boutique.com" class="buy-btn" target="_blank" data-i18n="buy">Acheter</a>
      </div>
    </div>

    <div class="card" data-category="chaussure" data-name-fr="baskets blanches" data-name-en="white sneakers">
      <img src="https://via.placeholder.com/400x500/1e1e1e/666?text=Photo" data-i18n-alt="productAlt" alt="Nom du vêtement">
      <div class="card-info">
        <h2 data-i18n="productName">Nom du vêtement</h2>
        <p class="price">19,99 €</p>
        <a href="https://www.exemple-boutique.com" class="buy-btn" target="_blank" data-i18n="buy">Acheter</a>
      </div>
    </div>

  </main>

  <p class="empty-msg" id="emptyMsg" data-i18n="emptyMsg">Aucun vêtement ne correspond à ta recherche.</p>

  <footer>
    <p data-i18n="footer">mobutufinds — les liens renvoient vers les boutiques partenaires</p>
  </footer>

  <script>
    const translations = {
      fr: {
        searchPlaceholder: 'Rechercher un vêtement...',
        catAll: 'Tout',
        catTshirt: 'T-shirts',
        catVeste: 'Vestes',
        catPantalon: 'Pantalons',
        catChaussure: 'Chaussures',
        catAccessoire: 'Accessoires',
        catSac: 'Sacs',
        catMontre: 'Montres',
        popular: 'Populaire',
        buy: 'Acheter',
        emptyMsg: 'Aucun vêtement ne correspond à ta recherche.',
        footer: 'mobutufinds — les liens renvoient vers les boutiques partenaires',
        theme: 'Thème',
        darkMode: 'Mode sombre',
        lightMode: 'Mode clair',
        language: 'Langue',
        productAlt: 'Nom du vêtement',
        productName: 'Nom du vêtement',
        menuLabel: 'Menu'
      },
      en: {
        searchPlaceholder: 'Search for clothing...',
        catAll: 'All',
        catTshirt: 'T-shirts',
        catVeste: 'Jackets',
        catPantalon: 'Pants',
        catChaussure: 'Shoes',
        catAccessoire: 'Accessories',
        catSac: 'Bags',
        catMontre: 'Watches',
        popular: 'Popular',
        buy: 'Buy',
        emptyMsg: 'No items match your search.',
        footer: 'mobutufinds — links redirect to partner stores',
        theme: 'Theme',
        darkMode: 'Dark mode',
        lightMode: 'Light mode',
        language: 'Language',
        productAlt: 'Product name',
        productName: 'Product name',
        menuLabel: 'Menu'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'fr';
    let currentTheme = localStorage.getItem('theme') || 'dark';
    let activeCategory = 'all';

    const searchInput = document.getElementById('searchInput');
    const categoryButtons = document.querySelectorAll('.category');
    const cards = document.querySelectorAll('#productGrid .card');
    const emptyMsg = document.getElementById('emptyMsg');
    const profileBtn = document.getElementById('profileBtn');
    const profileDropdown = document.getElementById('profileDropdown');
    const html = document.documentElement;

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      html.lang = lang;

      const t = translations[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (t[key]) el.textContent = t[key];
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        if (t[key]) el.placeholder = t[key];
      });

      document.querySelectorAll('[data-i18n-alt]').forEach(el => {
        const key = el.dataset.i18nAlt;
        if (t[key]) el.alt = t[key];
      });

      document.querySelectorAll('[data-lang-choice]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.langChoice === lang);
      });

      applyFilters();
    }

    function applyTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('theme', theme);
      html.dataset.theme = theme;

      document.querySelectorAll('[data-theme-choice]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.themeChoice === theme);
      });
    }

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      let visibleCount = 0;

      cards.forEach(card => {
        const nameKey = currentLang === 'en' ? 'nameEn' : 'nameFr';
        const productName = card.dataset[nameKey].toLowerCase();
        const matchesCategory = activeCategory === 'all' || card.dataset.category === activeCategory;
        const matchesSearch = productName.includes(query);
        const show = matchesCategory && matchesSearch;
        card.style.display = show ? '' : 'none';
        if (show) visibleCount++;
      });

      emptyMsg.style.display = visibleCount === 0 ? 'block' : 'none';
    }

    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = profileDropdown.classList.toggle('open');
      profileBtn.setAttribute('aria-expanded', isOpen);
    });

    document.addEventListener('click', () => {
      profileDropdown.classList.remove('open');
      profileBtn.setAttribute('aria-expanded', 'false');
    });

    profileDropdown.addEventListener('click', (e) => e.stopPropagation());

    document.querySelectorAll('[data-theme-choice]').forEach(btn => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.themeChoice));
    });

    document.querySelectorAll('[data-lang-choice]').forEach(btn => {
      btn.addEventListener('click', () => applyLanguage(btn.dataset.langChoice));
    });

    searchInput.addEventListener('input', applyFilters);

    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.category;
        applyFilters();
      });
    });

    applyTheme(currentTheme);
    applyLanguage(currentLang);
  </script>

</body>
</html>
