<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobutu Finds</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #141414;
    color: #fff;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 60px;
  }

  nav .logo {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  nav .agent-btn {
    background-color: #fff;
    color: #111;
    border: none;
    border-radius: 20px;
    padding: 10px 22px;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  nav .agent-btn:hover {
    background-color: #e91e63;
    color: #fff;
  }

  .hero {
    padding: 40px 60px 20px;
  }

  .hero h1 {
    font-size: 3.2rem;
    font-weight: 700;
    line-height: 1.15;
    max-width: 600px;
  }

  .hero h1 em {
    font-style: italic;
    font-weight: 400;
  }

  .search-bar {
    margin-top: 32px;
    max-width: 500px;
    background-color: #262626;
    border-radius: 30px;
    padding: 4px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 0.95rem;
    padding: 10px 0;
    font-family: inherit;
  }

  .search-bar input::placeholder {
    color: #999;
  }

  .categories {
    display: flex;
    gap: 26px;
    padding: 40px 60px;
    overflow-x: auto;
  }

  .category {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 70px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }

  .category .circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background-color: #262626;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    transition: background-color 0.2s ease, outline 0.2s ease;
  }

  .category.active .circle {
    background-color: #e91e63;
  }

  .category:hover .circle {
    background-color: #333;
  }

  .category.active:hover .circle {
    background-color: #e91e63;
  }

  .category span {
    font-size: 0.85rem;
    color: #ccc;
  }

  .section-title {
    padding: 20px 60px 0;
    font-size: 1.3rem;
    font-weight: 600;
  }

  .grid {
    padding: 24px 60px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  .card {
    background: #1e1e1e;
    border-radius: 14px;
    overflow: hidden;
    transition: transform 0.2s ease;
  }

  .card:hover {
    transform: translateY(-4px);
  }

  .card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
    background-color: #333;
  }

  .card-info {
    padding: 14px 16px;
  }

  .card-info h2 {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .card-info .price {
    color: #aaa;
    font-size: 0.9rem;
    margin-bottom: 12px;
  }

  .buy-btn {
    display: block;
    text-align: center;
    background-color: #fff;
    color: #111;
    text-decoration: none;
    padding: 10px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    transition: background-color 0.2s ease;
  }

  .buy-btn:hover {
    background-color: #e91e63;
    color: #fff;
  }

  .empty-msg {
    padding: 40px 60px;
    color: #888;
    display: none;
  }

  footer {
    text-align: center;
    padding: 30px 20px;
    color: #666;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

  <nav>
    <div class="logo">mobutu<span style="font-weight:400;">finds</span></div>
    <a href="#" class="agent-btn">Agent</a>
  </nav>

  <section class="hero">
    <h1>Trouve le style.<br><em>Paye moins.</em></h1>
    <div class="search-bar">
      🔍 <input type="text" id="searchInput" placeholder="Rechercher un vêtement...">
    </div>
  </section>

  <div class="categories" id="categoryBar">
    <button class="category active" data-category="all"><div class="circle">🔥</div><span>Tout</span></button>
    <button class="category" data-category="tshirt"><div class="circle">👕</div><span>T-shirts</span></button>
    <button class="category" data-category="veste"><div class="circle">🧥</div><span>Vestes</span></button>
    <button class="category" data-category="pantalon"><div class="circle">👖</div><span>Pantalons</span></button>
    <button class="category" data-category="chaussure"><div class="circle">👟</div><span>Chaussures</span></button>
    <button class="category" data-category="accessoire"><div class="circle">🧢</div><span>Accessoires</span></button>
    <button class="category" data-category="sac"><div class="circle">👜</div><span>Sacs</span></button>
    <button class="category" data-category="montre"><div class="circle">⌚</div><span>Montres</span></button>
  </div>

  <h2 class="section-title">Populaire</h2>
  <main class="grid" id="productGrid">

    <!-- Pour chaque produit : copie ce bloc, change data-category et data-name selon le vêtement -->
    <div class="card" data-category="tshirt" data-name="t-shirt blanc fleuri">
      <img src="https://via.placeholder.com/400x500/1e1e1e/666?text=Photo" alt="Nom du vêtement">
      <div class="card-info">
        <h2>Nom du vêtement</h2>
        <p class="price">29,99 €</p>
        <a href="https://www.exemple-boutique.com" class="buy-btn" target="_blank">Acheter</a>
      </div>
    </div>

    <div class="card" data-category="veste" data-name="veste noire">
      <img src="https://via.placeholder.com/400x500/1e1e1e/666?text=Photo" alt="Nom du vêtement">
      <div class="card-info">
        <h2>Nom du vêtement</h2>
        <p class="price">49,99 €</p>
        <a href="https://www.exemple-boutique.com" class="buy-btn" target="_blank">Acheter</a>
      </div>
    </div>

    <div class="card" data-category="chaussure" data-name="baskets blanches">
      <img src="https://via.placeholder.com/400x500/1e1e1e/666?text=Photo" alt="Nom du vêtement">
      <div class="card-info">
        <h2>Nom du vêtement</h2>
        <p class="price">19,99 €</p>
        <a href="https://www.exemple-boutique.com" class="buy-btn" target="_blank">Acheter</a>
      </div>
    </div>

  </main>

  <p class="empty-msg" id="emptyMsg">Aucun vêtement ne correspond à ta recherche.</p>

  <footer>
    <p>mobutufinds — les liens renvoient vers les boutiques partenaires</p>
  </footer>

  <script>
    const searchInput = document.getElementById('searchInput');
    const categoryButtons = document.querySelectorAll('.category');
    const cards = document.querySelectorAll('#productGrid .card');
    const emptyMsg = document.getElementById('emptyMsg');
    let activeCategory = 'all';

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      let visibleCount = 0;

      cards.forEach(card => {
        const matchesCategory = activeCategory === 'all' || card.dataset.category === activeCategory;
        const matchesSearch = card.dataset.name.toLowerCase().includes(query);
        const show = matchesCategory && matchesSearch;
        card.style.display = show ? '' : 'none';
        if (show) visibleCount++;
      });

      emptyMsg.style.display = visibleCount === 0 ? 'block' : 'none';
    }

    searchInput.addEventListener('input', applyFilters);

    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.category;
        applyFilters();
      });
    });
  </script>

</body>
</html>
